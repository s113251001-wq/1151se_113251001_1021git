<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
</head>
<body>
    <h1>新增學生</h1>

    <form action="/student/add" method="post">
        <p>
            學號：<input type="number" name="stuid" required>
        </p>
        <p>
            姓名：<input type="text" name="name" required>
        </p>
        <p>
            身高：<input type="number" name="height" required>
        </p>
        <p>
            <button type="submit">送出新增</button>
        </p>
    </form>

    <a href="/students/list/template">返回</a>
</body>
</html>
